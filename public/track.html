<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title data-i18n="title.track">FRIENDS | تتبع الطلب</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Changa:wght@400;600;700&family=Tajawal:wght@300;400;500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <div class="announcement">
    <div class="container">
      <div><strong data-i18n="track.announcement_title">تتبع طلبك</strong> <span data-i18n="track.announcement_subtitle">باستخدام رقم الطلب ورقم الهاتف.</span></div>
      <div>FRIENDS</div>
    </div>
  </div>

  <header class="site-header">
    <div class="container header-inner">
      <div class="brand">
        <div class="logo">
          <img src="images/logo-pharmaplast2.png" alt="Friends Logo" />
        </div>
        <div class="brand-text">
          <h1>FRIENDS</h1>
          <p data-i18n="brand.tagline">Friend For Medical Supplies</p>
        </div>
      </div>
      <nav class="main-nav">
        <a class="nav-link" href="index.html"><span class="nav-icon">⌂</span><span data-i18n="nav.home">الرئيسية</span></a>
        <a class="nav-link" href="cart.html"><span class="nav-icon">🛒</span><span data-i18n="nav.cart">السلة</span></a>
      </nav>
    </div>
  </header>

  <main>
    <section class="section">
      <div class="container">
        <div class="card auth-card">
          <h3 data-i18n="track.title">تتبع الطلب</h3>
          <label class="input-label" data-i18n="track.order_code_label">كود الطلب (أول 8 أحرف)</label>
          <input id="trackOrderCode" type="text" placeholder="مثال: a1b2c3d4" data-i18n-placeholder="track.order_code_placeholder" />

          <label class="input-label" data-i18n="track.phone_label">رقم الهاتف</label>
          <input id="trackPhone" type="tel" placeholder="01XXXXXXXXX" data-i18n-placeholder="track.phone_placeholder" />

          <button class="btn primary" id="trackBtn" data-i18n="action.track_now">تتبع الآن</button>
          <p class="note" id="trackMsg"></p>
        </div>

        <div class="card" id="trackResult" style="display:none; margin-top: 18px;"></div>
      </div>
    </section>
  </main>

  <script src="js/i18n.js"></script>
  <script src="js/track.js"></script>
  <script src="js/ui.js"></script>
</body>
</html>
